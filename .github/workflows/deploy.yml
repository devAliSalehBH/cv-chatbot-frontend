name: 🚀 Deploy to Hostinger VPS (Testing)

on:
  push:
    branches:
      - testing

  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy → Testing
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:

      # ============================
      # 1. Checkout
      # ============================
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4


      # ============================
      # 2. Setup Node.js
      # ============================
      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"


      # ============================
      # 3. Create environment file
      # ============================
      - name: 📝 Create .env.testing
        run: |
          cat > .env.testing << EOF
          NEXT_PUBLIC_API_BASE_URL=${{ vars.TESTING_API_BASE_URL }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ vars.TESTING_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_DATABASE_URL=${{ vars.TESTING_FIREBASE_DATABASE_URL }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ vars.TESTING_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.TESTING_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_APP_ID=${{ secrets.TESTING_FIREBASE_APP_ID }}
          OPENROUTER_API_KEY=${{ secrets.TESTING_OPENROUTER_API_KEY }}
          EOF


      # ============================
      # 4. Install dependencies
      # ============================
      - name: 📦 Install Dependencies
        run: npm install


      # ============================
      # 5. Build Next.js
      # ============================
      - name: 🏗️ Build Next.js App
        run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ vars.TESTING_API_BASE_URL }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN: ${{ vars.TESTING_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_DATABASE_URL: ${{ vars.TESTING_FIREBASE_DATABASE_URL }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID: ${{ vars.TESTING_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_API_KEY: ${{ secrets.TESTING_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_APP_ID: ${{ secrets.TESTING_FIREBASE_APP_ID }}
          OPENROUTER_API_KEY: ${{ secrets.TESTING_OPENROUTER_API_KEY }}


      # ============================
      # 6. Setup SSH
      # ============================
      - name: 🔑 Setup SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}


      # ============================
      # 7. Add VPS to known_hosts
      # ============================
      - name: 🌐 Add VPS to known_hosts
        run: |
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts


      # ============================
      # 8. Upload files to VPS
      # ============================
      - name: 📤 Sync Files to VPS
        run: |
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.env.local' \
            --exclude='.github' \
            ./ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_APP_PATH }}/


      # ============================
      # 9. Install & Restart App
      # ============================
      - name: 🔄 Install & Restart App on VPS
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            set -e

            cd ${{ secrets.VPS_APP_PATH }}

            echo "========================================="
            echo "🚀 Starting deployment..."
            echo "========================================="

            # ---------------------------------
            # Apply environment variables
            # ---------------------------------
            echo "🔧 Applying .env.testing..."

            cp .env.testing .env.local

            # ---------------------------------
            # Install production dependencies
            # ---------------------------------
            echo "📦 Installing production dependencies..."

            npm install --omit=dev

            # ---------------------------------
            # Verify Next.js production build
            # ---------------------------------
            echo "🔍 Checking Next.js production build..."

            if [ ! -f ".next/BUILD_ID" ]; then
              echo "❌ .next/BUILD_ID not found!"
              echo "❌ Production build is missing."
              exit 1
            fi

            echo "✅ Production build found."


            # ---------------------------------
            # Stop existing PM2 process
            # ---------------------------------
            echo "🛑 Stopping existing PM2 process..."

            pm2 stop cv-chatbot-frontend || true


            # ---------------------------------
            # Delete old PM2 process
            # ---------------------------------
            echo "🧹 Removing old PM2 process..."

            pm2 delete cv-chatbot-frontend || true


            # ---------------------------------
            # Start application
            # ---------------------------------
            echo "🚀 Starting Next.js application..."

            pm2 start npm \
              --name cv-chatbot-frontend \
              --cwd "${{ secrets.VPS_APP_PATH }}" \
              -- start


            # ---------------------------------
            # Save PM2 configuration
            # ---------------------------------
            echo "💾 Saving PM2 configuration..."

            pm2 save


            # ---------------------------------
            # Wait for application
            # ---------------------------------
            echo "⏳ Waiting for Next.js..."

            sleep 3


            # ---------------------------------
            # Check PM2 status
            # ---------------------------------
            echo "🔍 Checking PM2 status..."

            pm2 status


            # ---------------------------------
            # Check local application
            # ---------------------------------
            echo "🔍 Checking localhost:3000..."

            if ! curl -f --max-time 10 http://127.0.0.1:3000 > /dev/null; then
              echo "❌ Next.js is NOT responding on port 3000."

              echo "===== PM2 LOGS ====="
              pm2 logs cv-chatbot-frontend --lines 50 --nostream || true

              exit 1
            fi


            echo "========================================="
            echo "✅ Application is running on port 3000"
            echo "========================================="

            echo "🎉 Deployment completed successfully!"

          EOF


      # ============================
      # 10. Success
      # ============================
      - name: ✅ Deployment Success
        if: success()
        run: |
          echo "🎉 Deployed successfully to Testing environment!"


      # ============================
      # 11. Failure
      # ============================
      - name: ❌ Deployment Failed
        if: failure()
        run: |
          echo "💥 Deployment failed!"
          echo "Check the deployment logs above."