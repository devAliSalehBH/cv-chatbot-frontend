name: 🚀 Deploy to Hostinger VPS (Testing)

on:
  push:
    branches:
      - testing

  workflow_dispatch:

jobs:
  build-and-deploy:
    name: Build & Deploy → Testing
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:

      # ============================
      # 1. استنساخ الكود
      # ============================
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      # ============================
      # 2. إعداد Node.js
      # ============================
      - name: ⚙️ Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      # ============================
      # 3. إنشاء ملف .env.testing
      # ============================
      - name: 📝 Create .env.testing
        run: |
          cat > .env.testing << EOF
          NEXT_PUBLIC_API_BASE_URL=${{ vars.TESTING_API_BASE_URL }}
          NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=${{ vars.TESTING_FIREBASE_AUTH_DOMAIN }}
          NEXT_PUBLIC_FIREBASE_DATABASE_URL=${{ vars.TESTING_FIREBASE_DATABASE_URL }}
          NEXT_PUBLIC_FIREBASE_PROJECT_ID=${{ vars.TESTING_FIREBASE_PROJECT_ID }}
          NEXT_PUBLIC_FIREBASE_API_KEY=${{ secrets.TESTING_FIREBASE_API_KEY }}
          NEXT_PUBLIC_FIREBASE_APP_ID=${{ secrets.TESTING_FIREBASE_APP_ID }}
          OPENROUTER_API_KEY=${{ secrets.TESTING_OPENROUTER_API_KEY }}
          EOF

      # ============================
      # 4. إعداد SSH Key
      # ============================
      - name: 🔑 Setup SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}

      # ============================
      # 5. إضافة VPS إلى known_hosts
      # ============================
      - name: 🌐 Add VPS to known_hosts
        run: |
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      # ============================
      # 6. رفع Source Code إلى VPS
      # ============================
      - name: 📤 Sync Files to VPS
        run: |
          rsync -avz --delete \
            --exclude='.git' \
            --exclude='node_modules' \
            --exclude='.next' \
            --exclude='.env.local' \
            --exclude='.github' \
            ./ ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:${{ secrets.VPS_APP_PATH }}/

      # ============================
      # 7. Build & Restart على VPS
      # ============================
      - name: 🔨 Build & Restart App on VPS
        run: |
          ssh ${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }} << 'EOF'
            set -e

            cd ${{ secrets.VPS_APP_PATH }}

            echo "========================================"
            echo "🚀 Starting Testing Deployment"
            echo "========================================"

            # --------------------------------
            # تطبيق Environment Variables
            # --------------------------------
            echo "🔧 Applying .env.testing..."
            cp .env.testing .env.local

            # --------------------------------
            # إيقاف التطبيق القديم
            # --------------------------------
            echo "🛑 Stopping old PM2 process..."

            pm2 stop ecosystem.config.js || true

            # --------------------------------
            # حذف Build القديم
            # --------------------------------
            echo "🧹 Removing old Next.js build..."

            rm -rf .next

            # --------------------------------
            # تثبيت Dependencies
            # --------------------------------
            echo "📦 Installing dependencies..."

            npm ci

            # --------------------------------
            # Build على VPS
            # --------------------------------
            echo "🏗️ Building Next.js application..."

            npm run build

            # --------------------------------
            # تشغيل التطبيق
            # --------------------------------
            echo "🚀 Starting application..."

            pm2 start ecosystem.config.js --update-env

            # --------------------------------
            # حفظ PM2
            # --------------------------------
            echo "💾 Saving PM2 process list..."

            pm2 save

            # --------------------------------
            # انتظار تشغيل Next.js
            # --------------------------------
            echo "⏳ Waiting for Next.js to start..."

            sleep 5

            # --------------------------------
            # فحص PM2
            # --------------------------------
            echo "🔍 Checking PM2 status..."

            pm2 status

            # --------------------------------
            # فحص Port 3000
            # --------------------------------
            echo "🔍 Checking application on port 3000..."

            curl -f http://127.0.0.1:3000

            echo ""
            echo "========================================"
            echo "✅ Testing Deployment Successful!"
            echo "========================================"
          EOF

      # ============================
      # 8. Deployment Success
      # ============================
      - name: ✅ Deployment Success
        if: success()
        run: |
          echo "🎉 Deployed successfully to Testing environment!"

      # ============================
      # 9. Deployment Failed
      # ============================
      - name: ❌ Deployment Failed
        if: failure()
        run: |
          echo "💥 Deployment failed!"
          echo "Check the logs above for details."